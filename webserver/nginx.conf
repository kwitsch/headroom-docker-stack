server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Block the settings UI & endpoints (read-only dashboard) ──
    # Headroom already refuses /settings writes for non-loopback
    # callers; this block additionally removes the UI page.
    # Must come BEFORE the dashboard route (regex locations: first match).
    location ~ ^/(dashboard/settings|settings) {
        return 404;
    }

    # ── Headroom dashboard + read-only endpoints ───────────────────
    # Deliberately NO proxy to /v1/* — the API path stays exclusively
    # behind mitmproxy.
    location ~ ^/(dashboard|stats|stats-history|metrics|health|livez|readyz) {
        proxy_pass http://headroom:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── mitmproxy root CA download ─────────────────────────────
    # Volume mitm-certs (read-only): mitmproxy-ca-cert.pem/.cer/.p12
    location /ca/ {
        alias /usr/share/nginx/ca/;
        autoindex on;
        types { }
        default_type application/x-pem-file;
        add_header Content-Disposition "attachment";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
