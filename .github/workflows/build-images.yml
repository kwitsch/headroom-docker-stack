name: build-and-publish
on:
  push:
    branches: [main]
    paths:
      - "headroom/VERSION"
      - "mitmproxy/VERSION"
      - "webserver/VERSION"
permissions:
  contents: read
  packages: write
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed services
        id: detect
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before" 2>/dev/null; then
            # No usable before-SHA (new/recreated branch, or force-push/rebase rewrote
            # history past it) -- build every service rather than silently skip a
            # publish we can't prove didn't happen.
            changed_files=""
          else
            changed_files=$(git diff --name-only "$before" "${{ github.sha }}")
          fi
          services="[]"
          for svc in headroom mitmproxy webserver; do
            if [ -z "$changed_files" ] || echo "$changed_files" | grep -qx "$svc/VERSION"; then
              services=$(echo "$services" | jq -c --arg s "$svc" '. + [$s]')
            fi
          done
          echo "services=$services" >> "$GITHUB_OUTPUT"
  build:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: version
        run: echo "version=$(cat ${{ matrix.service }}/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/kwitsch/headroom-docker-stack/${{ matrix.service }}:${{ steps.version.outputs.version }}
