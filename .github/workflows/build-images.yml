name: build-and-publish
on:
  push:
    branches: [main]
    paths:
      - "headroom/VERSION"
      - "mitmproxy/VERSION"
      - "webserver/VERSION"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [headroom, mitmproxy, webserver]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect VERSION change for ${{ matrix.service }}
        id: changed
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
             | grep -qx "${{ matrix.service }}/VERSION"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read VERSION
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: echo "version=$(cat ${{ matrix.service }}/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.changed == 'true'
      - uses: docker/login-action@v3
        if: steps.changed.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.changed == 'true'
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/kwitsch/headroom-docker-stack/${{ matrix.service }}:${{ steps.version.outputs.version }}
            ghcr.io/kwitsch/headroom-docker-stack/${{ matrix.service }}:latest
